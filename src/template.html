<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
</head>

<body>
    <h1>To Do List</h1>
    <h3 id="page-title">Projects</h3>
    <div class="controls">
        <button id="home">🏠</button>
    </div>
    


    <div id="container">

    </div>
    <!-- <div id="sidepanel"></div> -->



    <dialog id="new-project">
        <label for="project-title">Title</label><br>
        <input type="text" name="project-title" id="project-title"><br>
        <button id="add-project-submit" value="default">Submit</button>
        <button commandfor="new-project" command="close">Close</button>
    </dialog>

    <dialog id="new-item">
        <label for="add-title">Title</label><br>
        <input type="text" name="add-title" id="add-title"><br>
        <label for="add-description">Description</label><br>
        <textarea name="add-description" id="add-description" rows="3" maxlength="500"></textarea><br>
        <label for="add-due-date">Due Date</label><br>
        <input type="date" id="add-due-date" name="add-due-date"><br>
        <label for="add-notes">Notes</label><br>
        <textarea name="add-notes" id="add-notes" rows="2.3" maxlength="200"></textarea><br>
        <input type="checkbox" id="add-completed" name="add-completed">
        <!-- <label for="add-completed"> Completed</label><br> -->
        <button id="submitBtn" value="default">Submit</button>
        <button commandfor="new-item" command="close">Close</button>
    </dialog>
    <!-- <button id="btn" command="show-modal" commandfor="new-item">New Item</button> -->
</body>

</html>
